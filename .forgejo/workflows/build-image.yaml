name: Build and Push Agent Workspace Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.forgejo/workflows/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner d execució (tunejat per defecte o node-slim de backup)'
        required: false
        default: 'rusc-runner'
        type: choice
        options:
          - rusc-runner
          - node-slim
      bump_type:
        description: 'Tipus d increment SemVer manual (opcional)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  REGISTRY: git.rusc.local
  IMAGE_NAME: vdk84/agent-workspace
  CONTAINER_HOST: unix:///var/run/docker.sock

jobs:
  build-and-publish:
    name: SemVer Bump & Container Build
    runs-on: ${{ inputs.runner || 'rusc-runner' }}
    steps:
      - name: Install CI dependencies (node-slim fallback)
        if: ${{ inputs.runner == 'node-slim' }}
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            git curl jq ca-certificates podman
          git config --global http.sslVerify false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: semver
        env:
          MANUAL_BUMP: ${{ inputs.bump_type || 'auto' }}
        run: |
          # Obtenir totes les etiquetes remotes
          git fetch --tags --force 2>/dev/null || true

          # Buscar l'última etiqueta semver existent (vX.Y.Z o X.Y.Z)
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag -l "[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          fi

          echo "Última etiqueta detectada: ${LATEST_TAG:-cap (primera versió)}"

          if [ -z "$LATEST_TAG" ]; then
            BASE_VERSION="0.0.0"
            COMMITS=$(git log --pretty=format:"%B" 2>/dev/null || echo "")
          else
            BASE_VERSION="${LATEST_TAG#v}"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%B" 2>/dev/null || echo "")
          fi

          # Extreure components major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Determinar el tipus d'increment
          if [ "$MANUAL_BUMP" != "auto" ] && [ -n "$MANUAL_BUMP" ]; then
            BUMP="$MANUAL_BUMP"
          else
            if echo "$COMMITS" | grep -qE "BREAKING CHANGE:|^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:|^.*#major"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "^feat(\([a-zA-Z0-9_-]+\))?:|^.*#minor"; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE "^(fix|perf|refactor|docs|chore|ci|build|test)(\([a-zA-Z0-9_-]+\))?:|^.*#patch"; then
              BUMP="patch"
            else
              if [ "$BASE_VERSION" = "0.0.0" ]; then
                BUMP="minor"
              else
                BUMP="patch"
              fi
            fi
          fi

          echo "Tipus d'increment seleccionat: $BUMP"

          # Calcular nous números de versió
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "Nova versió calculada: $NEW_VERSION ($NEW_TAG)"

          # Exportar outputs per a les següents passes
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Push Git Tag & Forgejo Release
        id: git_tag
        env:
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "actions@git.rusc.local"

          echo "Creant etiqueta git: $NEW_TAG"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [skip ci]"

          # Punts d'accés remots autenticats
          PROTO="${SERVER%%://*}"
          HOST_PORT_PATH="${SERVER#*://}"
          AUTH_URL="${PROTO}://${ACTOR}:${TOKEN}@${HOST_PORT_PATH}/${REPO}.git"

          git push "$AUTH_URL" "$NEW_TAG"

          # Publicar Release a Forgejo amb historial de commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || echo "")..HEAD 2>/dev/null || echo "- $NEW_TAG")
          RELEASE_PAYLOAD=$(jq -n \
            --arg tag "$NEW_TAG" \
            --arg name "Release $NEW_TAG" \
            --arg body "$CHANGELOG" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')

          curl -sk -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_PAYLOAD" \
            "${SERVER}/api/v1/repos/${REPO}/releases" || true

      - name: Log in to Forgejo Container Registry via podman --remote
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | podman --remote login "$REGISTRY" -u "$ACTOR" --password-stdin --tls-verify=false

      - name: Build and push Container Image via podman --remote
        env:
          VER_TAG: ${{ steps.semver.outputs.new_tag }}
          VER_NUM: ${{ steps.semver.outputs.new_version }}
          VER_MAJ: v${{ steps.semver.outputs.major }}
          VER_MIN: v${{ steps.semver.outputs.major }}.${{ steps.semver.outputs.minor }}
          GIT_SHA: ${{ github.sha }}
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"

          echo "Iniciant build amb podman --remote connectat a $CONTAINER_HOST..."

          podman --remote build \
            --tls-verify=false \
            --build-arg APP_VERSION="${VER_NUM}" \
            -t "${FULL_IMAGE}:latest" \
            -t "${FULL_IMAGE}:${VER_TAG}" \
            -t "${FULL_IMAGE}:${VER_NUM}" \
            -t "${FULL_IMAGE}:${VER_MIN}" \
            -t "${FULL_IMAGE}:${VER_MAJ}" \
            -t "${FULL_IMAGE}:${GIT_SHA}" \
            .

          echo "Pujant etiquetes al registre Forgejo..."
          for tag in latest "${VER_TAG}" "${VER_NUM}" "${VER_MIN}" "${VER_MAJ}" "${GIT_SHA}"; do
            podman --remote push --tls-verify=false "${FULL_IMAGE}:${tag}"
          done
          echo "Imatge publicada correctament!"
